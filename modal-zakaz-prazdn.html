<div class="modal" id="modal">
    <div class="modal-content form-big zoom-in">
        <span class="close-btn-overlay" id="closeModal">&times;</span>

        <h2 class="form-title">Оставить заявку</h2>
        <p class="form-subtitle">
            Чем подробнее вы заполните форму, тем быстрее и точнее мы подберём для вас идеальную программу мероприятия.
        </p>

        <form id="contactForm">
            <!-- ВЫБОР УСЛУГИ -->
            <div class="form-group">
                <label>Что вы хотите заказать? *</label>
                <select name="program" class="modal-select" required>
                    <option value="">Выберите вариант</option>
                    <option value="Не могу определиться — нужна помощь">Не могу определиться — нужна помощь</option>
                    <option value="Аниматор">Аниматор</option>
                    <option value="Шоу‑программа">Шоу‑программа</option>
                    <option value="Мастер‑класс">Мастер‑класс</option>
                    <option value="Оформление площадки">Оформление площадки</option>
                    <option value="Фотозона">Фотозона</option>
                    <option value="Квест">Квест</option>
                    <option value="Караоке">Караоке</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <!-- ПОЛЕ ДЛЯ "ДРУГОЕ" (ВСЕГДА ДОСТУПНО) -->
            <div class="form-group">
                <label>Если выбрали «Другое», укажите что именно</label>
                <input type="text" name="program_other" placeholder="Например: шоу мыльных пузырей, ростовая кукла..." class="modal-input">
            </div>

            <div class="form-group">
                <label>Тип мероприятия *</label>
                <input type="text" name="event_type" placeholder="День рождения, юбилей..." required>
            </div>

            <!-- ДАТА + ВРЕМЯ (РАЗДЕЛЕНЫ) -->
            <div class="form-row separated">
                <div class="date-col">
                    <div class="form-group">
                        <label>Дата</label>
                        <input type="date" name="date" class="date-input">
                    </div>
                </div>

                <div class="time-col">
                    <div class="form-group">
                        <label>Время</label>
                        <input type="time" name="time" class="time-input">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Точный адрес *</label>
                <input type="text" name="address" placeholder="Город, улица, дом..." required>
            </div>

            <div class="form-group">
                <label>Номер телефона *</label>
                <input type="tel" name="phone" placeholder="+7 (___) ___‑__‑__" required>
            </div>

            <div class="form-group">
                <label>Наличие парковки</label>
                <select name="parking" class="modal-select">
                    <option value="">Не выбрано</option>
                    <option value="Да">Да</option>
                    <option value="Нет">Нет</option>
                    <option value="Не знаю">Не знаю</option>
                </select>
            </div>

            <div class="form-group">
                <label>Тип площадки</label>
                <select name="place_type" class="modal-select">
                    <option value="">Не выбрано</option>
                    <option value="Квартира">Квартира</option>
                    <option value="Дом">Дом</option>
                    <option value="Кафе/ресторан">Кафе / ресторан</option>
                    <option value="Банкетный зал">Банкетный зал</option>
                    <option value="Детская комната">Детская комната</option>
                    <option value="На улице">На улице</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <div class="form-group">
                <label>Именинник: имя и возраст</label>
                <input type="text" name="birthday_child" placeholder="Например: София, 6 лет">
            </div>

            <div class="form-group">
                <label>Количество гостей и возраст</label>
                <input type="text" name="guests" placeholder="Например: 12 детей 6–8 лет">
            </div>

            <!-- ФОТО + ДЕКОР -->
            <div class="form-row separated">
                <div>
                    <div class="form-group">
                        <label>Фотосъёмка</label>
                        <select name="photo" class="modal-select">
                            <option value="">Не выбрано</option>
                            <option value="Нужна">Нужна</option>
                            <option value="Не нужна">Не нужна</option>
                        </select>
                    </div>
                </div>

                <div>
                    <div class="form-group">
                        <label>Доставка шаров</label>
                        <select name="decor" class="modal-select">
                            <option value="">Не выбрано</option>
                            <option value="Нужна">Нужна</option>
                            <option value="Не нужна">Не нужна</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Бюджет</label>
                <input type="text" name="budget" placeholder="Например: до 10 000 ₽">
            </div>

            <div class="form-group">
                <label>Дополнительная информация</label>
                <textarea name="extra" class="modal-textarea" placeholder="Пожелания, особенности площадки..."></textarea>
            </div>

            <button class="btn-primary glow form-btn">Отправить заявку</button>
        </form>
    </div>
</div>
