name: Set YML Content-Type
on:
  push:
    branches: [ main ]
    paths:
      - '**.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  fix-yml-content-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Upload YML files with correct Content-Type
        run: |
          mkdir -p _site
          cp -r * _site/
          cd _site
          for file in *.yml; do
            echo "Processing $file"
          done
        continue-on-error: true
      
      - name: Configure Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
